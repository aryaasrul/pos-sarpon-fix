<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Toko Terang POS</title>
  <!-- Semua CSS dimuat sekali -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="katalog.css">
  <link rel="stylesheet" href="riwayat.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="form-produk.css">
  <link rel="stylesheet" href="tambah-pengeluaran.css">
  <link rel="stylesheet" href="input-manual.css">
</head>
<body>

  <!-- Area konten – diganti oleh router saat navigasi -->
  <main id="spa-content"></main>

  <!-- Navbar persisten – tidak pernah di-reload -->
  <nav class="navbar" role="navigation" aria-label="Navigasi utama">
    <div class="nav-item">
      <img src="icons/orders-icon.svg" alt="Kasir">
      <span class="nav-label">Kasir</span>
    </div>
    <div class="nav-item">
      <img src="icons/database-icon.svg" alt="Katalog">
      <span class="nav-label">Katalog</span>
    </div>
    <div class="nav-item">
      <img src="icons/laporan-icon.svg" alt="Laporan">
      <span class="nav-label">Laporan</span>
    </div>
    <div class="nav-item">
      <img src="icons/dashboard-icon.svg" alt="Dashboard">
      <span class="nav-label">Dashboard</span>
    </div>
  </nav>

  <!-- Supabase SDK (pinned + SRI) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"
          integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg"
          crossorigin="anonymous"></script>

  <!-- Tandai sebagai SPA agar setiap page JS tidak auto-init via DOMContentLoaded -->
  <script src="js/spa-flag.js"></script>

  <!-- Shared JS -->
  <script src="js/error-handler.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/nav.js"></script>

  <!-- Semua page JS dimuat sekali -->
  <script src="js/kasir.js"></script>
  <script src="js/katalog.js"></script>
  <script src="js/riwayat.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/form-produk.js"></script>
  <script src="js/tambah-bean.js"></script>
  <script src="js/tambah-pengeluaran.js"></script>
  <script src="js/input-manual.js"></script>

  <!-- Router – harus paling akhir -->
  <script src="js/router.js"></script>
</body>
</html>
